<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سَنَد – تمريض منزلي</title>
<meta name="theme-color" content="#0F1B2D"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F4F6;--card:#fff;--ink:#0F1B2D;--mut:#667085;--gold:#A8843E;--line:#E2E5EA;--ok:#2E8F76;--bad:#C2503D;--hero:#0F1B2D;--herotx:#F3F4F6;--herogold:#D8B974;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0A1220;--card:#121E32;--ink:#EEF0F4;--mut:#93A0B5;--gold:#D8B974;--line:#22314A;--ok:#4FC3A5;--bad:#F08A76;--hero:#16243D}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Readex Pro',system-ui,sans-serif;line-height:1.7;font-size:15px}
main{max-width:480px;margin:0 auto;padding:12px 16px 60px}
.tabs{overflow-x:auto;display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin-top:10px}
.tabs button{flex:1 0 auto;white-space:nowrap;background:none;color:var(--mut);border:0;border-radius:10px;padding:8px 10px;font:inherit;font-size:.82rem;font-weight:600;cursor:pointer;min-height:44px}
.tabs button.on{background:var(--hero);color:var(--herotx)}
.hero{background:var(--hero);color:var(--herotx);border-radius:22px;padding:22px 20px;margin-top:12px}
.hero h1{font-size:1.7rem;font-weight:700;line-height:1.3;color:var(--herogold)}.hero p{opacity:.8;font-weight:300}
h2{font-size:1.05rem;font-weight:700;margin:18px 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px}
.svc{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:8px;font:inherit;cursor:pointer;min-height:52px}
.svc.on{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}.svc .t{flex:1}.svc small{display:block;color:var(--mut);font-weight:300}.svc b{color:var(--gold)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:13px;font:inherit;font-weight:700;background:var(--hero);color:var(--herotx);cursor:pointer;margin-top:12px;min-height:48px}
.btn.g{background:var(--gold);color:#0F1B2D}.btn.o{background:none;color:var(--ink);border:1.5px solid var(--line)}.btn:disabled{opacity:.4}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.mut{color:var(--mut);font-weight:300}.gold{color:var(--gold);font-weight:700}.ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}
.steps{display:flex;gap:6px;margin-top:10px}.steps i{flex:1;height:5px;border-radius:9px;background:var(--line)}.steps i.on{background:var(--gold)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.k{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}.k b{display:block;font-size:1.25rem}
.sw{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font:inherit;cursor:pointer;min-height:40px;display:inline-block;margin:3px 3px 0 0}
.sw.on{background:var(--ok);color:#fff;border-color:var(--ok)}
input,textarea{width:100%;font:inherit;padding:11px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:.85rem}td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}th{color:var(--mut);font-weight:400}.x{overflow-x:auto}
.toast{position:fixed;inset:auto 16px calc(16px + env(safe-area-inset-bottom,0px));max-width:440px;margin:auto;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:600;text-align:center;z-index:2000}
.st button{background:none;border:0;font-size:1.8rem;cursor:pointer;color:var(--line);min-width:44px;min-height:44px}.st button.on{color:var(--gold)}
.av{width:46px;height:46px;border-radius:50%;background:var(--hero);color:var(--herogold);display:grid;place-items:center;font-weight:700;flex:none}
@media print{.tabs,button,.toast,input,.sw{display:none!important}}
a{color:var(--gold)}
</style>
</head>
<body>
<main id="v"></main>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
var SB=supabase.createClient('https://tsxvmmzhqrpwostxlgce.supabase.co','sb_publishable_lH02LIooEUgGRjnlNlPduw_vjt3lSbj');
var S={u:null,p:null,d:{},mode:'in',role:'client',sel:{},fam:'لنفسي',pm:'cash',abr:false,sign:false,tab:'o',view:null,toast:'',j:'',urls:{},np:null,loc:null,pv:false,nt:'h',wm:'insta',rep:'d',rv:false};
var PM={cash:'كاش',insta:'إنستاباي',wal:'محفظة',card:'حساب بنكي'};
var STL={new:'بندوّر على ممرض…',accepted:'الممرض في الطريق',arrived:'الممرض وصل',started:'الخدمة جارية',done:'تمت الخدمة',cancelled:'اتلغى'};
var SI=['accepted','arrived','started','done'];
var DOCS=[['grad','شهادة التخرج'],['intern','شهادة الامتياز'],['id_front','البطاقة (وش)'],['id_back','البطاقة (ضهر)'],['syndicate','كارنيه النقابة'],['license','كارنيه المزاولة']];
var STP=['اتصلت بالعميل','اتصلت بالممرض','استدعيت الإسعاف ١٢٣','أوقفت الحساب'];
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function f(n){return Number(n||0).toLocaleString('ar-EG')}
function q(r){if(r.error)throw r.error;return r.data}
function val(i){var e=document.getElementById(i);return e?e.value.trim():''}
function card(x){return '<div class="card">'+x+'</div>'}
function hero(t,s){return '<div class="hero"><h1>'+t+'</h1><p>'+s+'</p></div>'}
function bar(s){var i=SI.indexOf(s),h='<div class="steps">';for(var k=0;k<4;k++)h+='<i class="'+(k<=i?'on':'')+'"></i>';return h+'</div>'}
function B(a,t,c){return '<button class="'+(c||'btn')+'" data-a="'+a+'">'+t+'</button>'}
function K(l,v){return '<div class="k"><span class="mut">'+l+'</span><b>'+v+'</b></div>'}
function nrs(p){return Array.isArray(p.nurses)?p.nurses[0]||{}:p.nurses||{}}
function pn(id){var x=(S.d.pr||[]).filter(function(p){return p.id===id})[0];return x?esc(x.name||'—'):'—'}
function svn(o){return (o.services||[]).map(esc).join(' + ')}
function say(t){S.toast=t;render();setTimeout(function(){S.toast='';render()},3500)}

/* ---------- تحميل البيانات ---------- */
async function load(force){
  if(!S.u)return;
  var p=q(await SB.from('profiles').select('*,nurses(*)').eq('id',S.u.id).single()),d={};
  d.cf=q(await SB.from('settings').select('*').single());d.dc=q(await SB.from('doctors').select('*').eq('active',true));
  var oj='*,nurse:profiles!nurse_id(name,phone,code,nurses(rating,visits)),client:profiles!client_id(name,phone,code)';
  if(p.role==='client'){
    d.sv=q(await SB.from('services').select('*').eq('active',true).order('id'));
    d.o=q(await SB.from('orders').select(oj).eq('client_id',S.u.id).order('id',{ascending:false}).limit(15));
  }else if(p.role==='nurse'){
    var n=nrs(p);
    if(n.reg_status==='ok'){
      d.nw=q(await SB.from('orders').select(oj).eq('status','new').order('id'));
      d.o=q(await SB.from('orders').select(oj).eq('nurse_id',S.u.id).order('id',{ascending:false}).limit(100));d.wr=q(await SB.from('wallet_requests').select('*').order('id',{ascending:false}).limit(20));
    }else if(n.reg_status==='new'){
      d.up={};var fl=q(await SB.storage.from('nurse-docs').list(S.u.id));(fl||[]).forEach(function(x){d.up[x.name.split('.')[0]]=S.u.id+'/'+x.name});
    }
  }else{
    d.pr=q(await SB.from('profiles').select('*,nurses(*)').order('created_at',{ascending:false}));
    d.o=q(await SB.from('orders').select(oj).order('id',{ascending:false}).limit(1000));d.wr=q(await SB.from('wallet_requests').select('*').order('id',{ascending:false}).limit(200));
    d.cm=q(await SB.from('complaints').select('*').order('id',{ascending:false}));
    d.in=q(await SB.from('incidents').select('*').order('id',{ascending:false}));
  }
  if(p.role!=='nurse'||nrs(p).reg_status==='ok'){var rp=q(await SB.from('reports').select('*'));d.rp={};rp.forEach(function(r){d.rp[r.order_id]=r});var ol=q(await SB.from('order_loc').select('*'));d.ol={};ol.forEach(function(r){d.ol[r.order_id]=r})}
  if(p.role==='nurse'&&nrs(p).reg_status==='ok')track();
  var j=JSON.stringify([p,d,Math.floor(Date.now()/60000),S.np?S.np.lat.toFixed(4)+S.np.lng.toFixed(4):'']);
  if(force||j!==S.j){S.j=j;S.p=p;S.d=d;render()}
}
async function run(fn){try{await fn();await load(true)}catch(e){say(e.message||'حصل خطأ')}}

function na(x){var n=x&&x.nurses;return Array.isArray(n)?n[0]||{}:n||{}}
function tier(v){return v>=30?'🥇 ذهبي':v>=10?'🥈 فضي':'🥉 برونزي'}
function dist(a,b){var R=6371,t=Math.PI/180,dl=(b.lat-a.lat)*t,dn=(b.lng-a.lng)*t,x=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dn/2)*Math.sin(dn/2);return 2*R*Math.asin(Math.sqrt(x))}
function tel(ph){var d=String(ph).replace(/\D/g,''),w=d.charAt(0)==='0'?'2'+d:d;return '<a class="sw" href="tel:'+esc(ph)+'">📞 اتصال</a><a class="sw" target="_blank" rel="noopener" href="https://wa.me/'+w+'">💬 واتساب</a>'}
function getPos(){return new Promise(function(res,rej){if(!navigator.geolocation)return rej(new Error('المتصفح لا يدعم تحديد الموقع'));navigator.geolocation.getCurrentPosition(function(p){res({lat:p.coords.latitude,lng:p.coords.longitude})},function(){rej(new Error('اسمح للتطبيق بالوصول لموقعك من إعدادات المتصفح'))},{enableHighAccuracy:true,timeout:15000})})}
function track(){if(S.tw||!navigator.geolocation)return;S.tw=navigator.geolocation.watchPosition(function(p){S.np={lat:p.coords.latitude,lng:p.coords.longitude}},function(){},{enableHighAccuracy:true,maximumAge:5000})}
function sendLoc(){var o=S.d&&S.d.o,a=S.p&&S.p.role==='nurse'&&o&&o.filter(function(x){return x.status==='accepted'||x.status==='arrived'})[0];if(!a||!S.np||Date.now()-(S.ls||0)<7000)return;S.ls=Date.now();SB.rpc('update_location',{p_id:a.id,p_lat:S.np.lat,p_lng:S.np.lng}).then(function(){})}
function pad(n,w){return String(n).padStart(w||5,'0')}
function oc(o){var d=new Date(o.created_at);return 'O-'+String(d.getFullYear()).slice(2)+pad(d.getMonth()+1,2)+'-'+pad(o.id)}
function sod(d){var x=new Date(d);x.setHours(0,0,0,0);return x}
function mins(a){return Math.max(0,Math.floor((Date.now()-new Date(a))/60000))}
function sum(l,k){return l.reduce(function(a,x){return a+Number(x[k]||0)},0)}
function sumS(l,dt,k){return sum(l.filter(function(x){return new Date(x.finished_at)>=dt}),k)}
function pc(id){var x=(S.d.pr||[]).filter(function(p){return p.id===id})[0];return x?esc(x.code||''):''}
var CR=['١. لازم يكون معاك شخص بالغ في البيت وقت الزيارة.','٢. جهّز الروشتة والأدوية وبلّغ الممرض بأي حساسية أو أمراض مزمنة.','٣. الدفع داخل التطبيق فقط، وماتتفقش مع الممرض على زيارات بره.','٤. زرار الطوارئ للخطر الفعلي، ولو الحياة في خطر اتصل ١٢٣ الأول.'];
var NR=['١. اشتغل في حدود ترخيصك بس، ومن غير روشتة ماتديش حقن.','٢. التزم بالتعقيم وسجّل كل زيارة.','٣. ممنوع الاتفاق مع العملاء على زيارات خارج التطبيق.','٤. سدّد نسبة الشركة في موعدها.','٥. لو شفت خطر: ١٢٣ الأول، وبعدين زرار الطوارئ.'];
var PR=['١. خطر على الحياة (إغماء، نزيف، ضيق تنفس): اتصل ١٢٣ فوراً.','٢. اضغط زرار الطوارئ، وفريق العمليات هيتصل بيكم في دقايق.','٣. لو مشكلة أمان أو سلوك: الممرض يخرج من المكان فوراً.','٤. الشركة بتسجّل الحادثة وبتبعت تقرير للإدارة.'];
function rulesC(){var d=S.d,nur=S.p.role==='nurse',nm=[['إسعاف','123'],['الشرطة','122'],['الحماية المدنية','180']];if(d.cf&&d.cf.ops_phone)nm.push(['عمليات سَنَد',d.cf.ops_phone]);
return '<h2>📞 أرقام الطوارئ</h2>'+card(nm.map(function(r){return '<div class="row" style="padding:5px 0"><span>'+r[0]+'</span><a class="gold" href="tel:'+esc(r[1])+'">'+esc(r[1])+'</a></div>'}).join(''))
+'<h2>👨‍⚕️ أطباء الشركة</h2>'+card((d.dc||[]).length?d.dc.map(function(x){return '<div class="row" style="padding:5px 0"><span>'+esc(x.name)+'<small class="mut"> · '+esc(x.specialty)+'</small></span><a class="gold" href="tel:'+esc(x.phone)+'">'+esc(x.phone)+'</a></div>'}).join(''):'<span class="mut">لسه مفيش</span>')
+'<h2>'+(nur?'قواعد الممرض':'قواعد للعميل')+'</h2>'+card('<p>'+(nur?NR:CR).join('<br>')+'</p>')+'<h2>لو حصلت طوارئ</h2>'+card('<p>'+PR.join('<br>')+'</p>')}
var MAP=null,MEL=null,MK={};
function mapFor(pts){var ph=document.getElementById('mph');if(!ph||!window.L||!pts.length)return;
 if(!MEL){MEL=document.createElement('div');MEL.style.cssText='height:260px;border-radius:14px;margin-top:10px';MAP=L.map(MEL).setView([pts[0].lat,pts[0].lng],14);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(MAP)}
 ph.replaceWith(MEL);MAP.invalidateSize();var ks={};
 pts.forEach(function(p){ks[p.k]=1;var ll=[p.lat,p.lng];if(MK[p.k])MK[p.k].setLatLng(ll);else MK[p.k]=L.marker(ll,{icon:L.divIcon({html:'<div style="font-size:26px;line-height:30px">'+p.em+'</div>',className:'',iconSize:[30,30],iconAnchor:[15,15]})}).addTo(MAP)});
 Object.keys(MK).forEach(function(k){if(!ks[k]){MAP.removeLayer(MK[k]);delete MK[k]}});
 var key=pts.map(function(p){return p.k+p.lat.toFixed(3)+p.lng.toFixed(3)}).join('|');
 if(MAP._k!==key){MAP._k=key;if(pts.length>1)MAP.fitBounds(pts.map(function(p){return [p.lat,p.lng]}),{padding:[30,30],maxZoom:16});else MAP.setView([pts[0].lat,pts[0].lng],15)}}
function etaTxt(o,ol){if(o.nurse_lat==null||!ol)return 'بستنى موقع الممرض…';if(o.status==='arrived')return 'الممرض وصل';var k=dist({lat:+o.nurse_lat,lng:+o.nurse_lng},{lat:+ol.lat,lng:+ol.lng});return 'يبعد '+f(Math.round(k*10)/10)+' كم · حوالي '+f(Math.max(1,Math.round(k/25*60)))+' دقيقة'}
function nurseCard(n){var x=na(n),v=x.visits||0;return '<div class="row" style="justify-content:flex-start;gap:12px"><div class="av">'+esc((n.name||'م').charAt(0))+'</div><div style="flex:1"><b>'+esc(n.name||'ممرض')+'</b> <small class="mut">'+esc(n.code||'')+'</small> <span class="ok">✓ موثّق</span><div class="mut">'+(x.rating?'⭐ '+x.rating:'جديد')+' · '+f(v)+' زيارة · '+tier(v)+'</div></div></div>'+(n.phone?'<div>'+tel(n.phone)+'</div>':'')}
function navBlock(o){var ol=S.d.ol&&S.d.ol[o.id];if(!ol)return '';S.mp=[{k:'c',lat:+ol.lat,lng:+ol.lng,em:'🏠'}].concat(S.np?[{k:'n',lat:S.np.lat,lng:S.np.lng,em:'🩺'}]:[]);return card('<b>📍 العنوان</b><p>'+esc(ol.addr||'—')+'</p><a class="sw" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination='+ol.lat+','+ol.lng+'">🧭 افتح الاتجاهات</a><div id="mph"></div>')}
function profV(){var p=S.p,fo=!p.name||!p.phone;return hero(fo?'كمّل بياناتك':'بياناتي','الاسم والموبايل بيظهروا للطرف التاني في الزيارة')+card('<label class="mut">الاسم</label><input id="pn" value="'+esc(p.name)+'" placeholder="الاسم"><label class="mut">الموبايل</label><input id="pp" value="'+esc(p.phone)+'" inputmode="tel" placeholder="01xxxxxxxxx"><p class="mut">الإيميل: '+esc(S.u.email)+'</p>'+B('savep','حفظ','btn g')+(fo?'':B('prof','رجوع','btn o')))}
/* ---------- الدخول ---------- */
function authV(){var up=S.mode==='up';
return hero('سَنَد','تمريض منزلي بمستوى فندقي')+card('<div class="tabs" style="margin-top:0">'+B('m:in','دخول',up?'':'on')+B('m:up','حساب جديد',up?'on':'')+'</div>'
+(up?'<input id="nm" placeholder="الاسم"><input id="ph" placeholder="رقم الموبايل" inputmode="tel"><div class="grid">'+B('r:client','عميل','svc'+(S.role==='client'?' on':''))+B('r:nurse','ممرض','svc'+(S.role==='nurse'?' on':''))+'</div>':'')
+'<input id="em" type="email" placeholder="الإيميل" autocomplete="email"><input id="pw" type="password" placeholder="الباسوورد (٦ حروف على الأقل)" autocomplete="current-password">'+B(up?'su':'si',up?'إنشاء الحساب':'دخول','btn g'))}

/* ---------- العميل ---------- */
function clientV(){
var p=S.p,d=S.d,o=d.o||[],ac=o.filter(function(x){return ['new','accepted','arrived','started'].indexOf(x.status)>-1})[0];
if(S.pv||!p.name||!p.phone)return profV();
if(S.rv)return hero('القواعد والطوارئ','للسلامة')+B('rv','‹ رجوع','sw')+rulesC();
var h=hero('أهلاً '+esc(p.name||''),'كود العميل: '+esc(p.code||'—'))+B('prof','بياناتي','sw')+B('rv','القواعد','sw')+B('out','خروج','sw');
if(p.status!=='active')return h+card('<b class="bad">حسابك موقوف. تواصل مع الشركة.</b>');
if(ac)h+=activeC(ac);
else{
 var ld=o[0];
 if(ld&&ld.status==='done'&&!localStorage.getItem('sd'+ld.id))h+=doneC(ld);
 h+='<h2>اختار الخدمة</h2>';
 var t=0,fee=d.cf.visit_fee;
 (d.sv||[]).forEach(function(s){var on=S.sel[s.id];if(on)t+=Number(s.price);h+='<button class="svc'+(on?' on':'')+'" data-a="sel:'+s.id+'"><span class="t">'+esc(s.name)+'</span><b>'+(s.time_based?'بالوقت':f(s.price)+' ج')+'</b></button>'});
 var any=Object.keys(S.sel).some(function(k){return S.sel[k]});
