<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سَنَد – تمريض منزلي</title>
<meta name="theme-color" content="#0F1B2D"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F4F6;--card:#fff;--ink:#0F1B2D;--mut:#667085;--gold:#A8843E;--line:#E2E5EA;--ok:#2E8F76;--bad:#C2503D;--hero:#0F1B2D;--herotx:#F3F4F6;--herogold:#D8B974;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1220;--card:#121E32;--ink:#EEF0F4;--mut:#93A0B5;--gold:#D8B974;--line:#22314A;--ok:#4FC3A5;--bad:#F08A76;--hero:#16243D}}
:root[data-theme="dark"]{--bg:#0A1220;--card:#121E32;--ink:#EEF0F4;--mut:#93A0B5;--gold:#D8B974;--line:#22314A;--ok:#4FC3A5;--bad:#F08A76;--hero:#16243D}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:'Readex Pro',system-ui,sans-serif;line-height:1.7;font-size:15px}
main{max-width:480px;margin:0 auto;padding:12px 16px 40px}
.tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tabs button{flex:1;background:none;color:var(--mut);border:0;border-radius:10px;padding:9px 4px;font:inherit;font-weight:600;cursor:pointer;min-height:44px}
.tabs button.on{background:var(--hero);color:var(--herotx)}
.hero{background:var(--hero);color:var(--herotx);border-radius:22px;padding:24px 20px;margin-top:14px}
.hero h1{font-size:2.3rem;font-weight:700;line-height:1.2;color:var(--herogold)}
.hero p{opacity:.8;margin-top:6px;font-weight:300}
h2{font-size:1.05rem;font-weight:700;margin:20px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px}
.svc{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:8px;font:inherit;cursor:pointer;min-height:56px}
.svc.on{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.svc .e{font-size:1.5rem}.svc .t{flex:1}.svc small{display:block;color:var(--mut);font-weight:300}
.svc b{color:var(--gold)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:700;background:var(--hero);color:var(--herotx);cursor:pointer;margin-top:14px;min-height:48px}
.btn.g{background:var(--gold);color:#0F1B2D}.btn.o{background:none;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.mut{color:var(--mut);font-weight:300}
.gold{color:var(--gold);font-weight:700}
.steps{display:flex;gap:6px;margin-top:12px}
.steps i{flex:1;height:5px;border-radius:9px;background:var(--line)}.steps i.on{background:var(--gold)}
.pulse{width:14px;height:14px;border-radius:50%;background:var(--gold);display:inline-block;animation:p 1.4s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(200,169,106,.6)}100%{box-shadow:0 0 0 16px rgba(200,169,106,0)}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.av{width:48px;height:48px;border-radius:50%;background:var(--hero);color:var(--herogold);display:grid;place-items:center;font-weight:700;font-size:1.2rem;flex:none}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--gold)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.k{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}.k b{display:block;font-size:1.35rem}
.ok{color:var(--ok);font-weight:600}
.sw{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font:inherit;cursor:pointer;min-height:44px}
.sw.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.st button{background:none;border:0;font-size:1.8rem;cursor:pointer;color:var(--line);min-width:44px;min-height:44px}.st button.on{color:var(--gold)}
table{width:100%;border-collapse:collapse;font-size:.88rem}td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right}th{color:var(--mut);font-weight:400}
input{width:100%;font:inherit;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);margin-top:6px}
.x{overflow-x:auto}
</style>
</head>
<body>
<main>
<div class="tabs" role="tablist"><button data-m="c" class="on">العميل</button><button data-m="n">الممرض</button><button data-m="a">الشركة</button><button data-m="r">القواعد</button></div>
<div id="v"></div>
</main>
<script>
var SV=[{id:1,e:'🩺',n:'قياس ضغط',p:150},{id:2,e:'🩸',n:'قياس سكر',p:150},{id:3,e:'💉',n:'حقن (بروشتة)',p:200},{id:4,e:'🩹',n:'تغيير جروح',p:250},{id:5,e:'📋',n:'متابعة حالة (ساعة)',p:400},{id:6,e:'💧',n:'محلول (بالوقت)',p:0,tm:1}];
var FEE=50,PCT=.2,LIM=500;
var S={m:'c',sel:{},o:null,on:true,debt:120,earn:0,rate:0,
log:[{id:101,s:'ضغط + سكر',t:350,n:'منى'},{id:102,s:'حقن',t:250,n:'كريم'},{id:103,s:'متابعة حالة',t:450,n:'منى'},{id:104,s:'تغيير جروح',t:300,n:'سارة'}]};
var N={name:'منى حسن',ch:'م',lic:'نقابة التمريض ✓',r:'4.9'};
var K='sanad:v1';
try{var z=JSON.parse(localStorage.getItem(K));if(z)Object.assign(S,z)}catch(e){}
if(S.pct!=null)PCT=S.pct;if(S.fee)FEE=S.fee;
S.pend=S.pend||['هدى إبراهيم','أحمد سمير','نور علي'];S.ver=S.ver||12;S.pm=S.pm||'cash';S.inc=S.inc||[];S.wa=S.wa||[];S.av=S.av||'o';S.pn=0;S.pc=0;
S.nu=S.nu||['منى حسن','كريم عادل','سارة محمود','ياسمين خالد','عمر فتحي','نورهان سمير','محمود رضا','دينا أشرف','إسلام جمال','رنا طارق'].map(function(n,i){return {id:i+1,n:n,base:[5,40,15,8,25,12,32,9,18,6][i],ph:'01'+['0','1','2','5','0','1','2','5','0','1'][i]+'0000000'+i,docs:[1,1,1,1,1,1],st:'active',debt:[0,0,80,40,0,120,0,0,60,0][i]}});
S.cl=S.cl||['العميل التجريبي','أحمد علي','مي حسام','طارق محمد','ليلى سعد','حسن إبراهيم','سلمى عادل','يوسف كمال','هالة منصور','باسم رشدي'].map(function(n,i){return {id:i+1,n:n,ph:'01'+['0','1','2','5','0','1','2','5','0','1'][i]+'1111111'+i,st:'active'}});
S.ords=S.ords||(function(){var a=[],sv=['ضغط + سكر','حقن','تغيير جروح','متابعة حالة','محلول (بالوقت)','قياس سكر'],ts=[350,250,300,450,520,200],rt=[5,5,4,5,3,4];for(var i=0;i<34;i++)a.push({id:i+1,cl:(i*3)%10+1,nu:(i*7)%10+1,s:sv[i%6],t:ts[i%6],rt:rt[(i*5)%6],pm:i%3?'cash':'insta'});return a})();
S.cmp=S.cmp||[{id:1,from:'client',cl:4,nu:2,txt:'تأخر ٤٠ دقيقة عن الميعاد',st:'open',tm:'٢٠/١٠'},{id:2,from:'nurse',cl:6,nu:4,txt:'العميل طلب الاتفاق خارج التطبيق',st:'open',tm:'٢٢/١٠'},{id:3,from:'client',cl:3,nu:7,txt:'ملاحظة على التعقيم',st:'closed',act:'تحذير',tm:'١٥/١٠'}];S.recs=S.recs||[];S.fam=S.fam||'لنفسي';S.co=S.co||[{n:'شركة (مثال)',e:120,v:2,p:200},{n:'مصنع (مثال)',e:300,v:1,p:180}];S.drs=S.drs||[{n:'د. (اسم الطبيب) – مثال',sp:'باطنة',ph:'01000000000'}];S.r15=S.r15||75;S.reg=S.reg||'ok';S.docs=S.docs||[1,1,1,1,1,1];S.sign=S.sign!=null?S.sign:true;
S.m=({'#n':'n','#a':'a'})[location.hash]||'c';
function sv(){try{var c=JSON.parse(JSON.stringify(S));delete c.m;localStorage.setItem(K,JSON.stringify(c))}catch(e){}}
window.addEventListener('storage',function(e){if(e.key===K&&e.newValue){try{var m=S.m;Object.assign(S,JSON.parse(e.newValue));S.m=m;if(S.pct!=null)PCT=S.pct;if(S.fee)FEE=S.fee;render()}catch(x){}}});
function tot(){var t=0;SV.forEach(function(s){if(S.sel[s.id])t+=s.p});return Object.keys(S.sel).some(function(k){return S.sel[k]})?t+FEE:0}
function el(o){return o.t0?Math.floor((Date.now()-o.t0)/60000)+(o.off||0):0}
function bill(o){return o.fx+(o.tm?Math.max(1,Math.ceil(el(o)/15))*S.r15:0)}
function cur(o){return o.st==='done'?o.t:o.st==='started'?bill(o):o.fx}
function pmn(k){return {cash:'كاش',insta:'إنستاباي',wal:'محفظة',card:'حساب بنكي'}[k]||'كاش'}
var OPS='01000000000',STP=['اتصلت بالعميل','اتصلت بالممرض','استدعيت الإسعاف ١٢٣','أوقفت حساب الممرض مؤقتاً'];
var CR=['١. لازم يكون معاك شخص بالغ في البيت وقت الزيارة.','٢. جهّز الروشتة والأدوية وبلّغ الممرض بأي حساسية أو أمراض مزمنة.','٣. الدفع داخل التطبيق فقط، وماتتفقش مع الممرض على زيارات بره.','٤. زرار الطوارئ للخطر الفعلي، ولو الحياة في خطر اتصل ١٢٣ الأول.','٥. تقدر تلغي الطلب قبل وصول الممرض.'];
var NR=['١. اشتغل في حدود ترخيصك بس، ومن غير روشتة ماتديش حقن.','٢. التزم بالتعقيم وسجّل كل زيارة.','٣. ممنوع الاتفاق مع العملاء على زيارات خارج التطبيق.','٤. سدّد نسبة الشركة في موعدها.','٥. لو شفت خطر: ١٢٣ الأول، وبعدين زرار الطوارئ.'];
var PR=['١. خطر على الحياة (إغماء، نزيف، ضيق تنفس): اتصل ١٢٣ فوراً.','٢. اضغط زرار الطوارئ، وفريق العمليات هيتصل بيكم في دقايق.','٣. لو مشكلة أمان أو سلوك: الممرض يخرج من المكان فوراً.','٤. الشركة بتسجّل الحادثة وبتبعت تقرير للإدارة.'];
function tmn(){return new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function wa(to,m){S.wa.unshift({tm:tmn(),to:to,m:m});S.wa=S.wa.slice(0,30)}
function tier(n){return n>=30?'🥇 ذهبي':n>=10?'🥈 فضي':'🥉 برونزي'}
function nv(x){return x.base+S.ords.filter(function(o){return o.nu===x.id}).length}
function vis(){return nv(S.nu[0])}
var STN={active:'نشط',suspended:'موقوف',deleted:'محذوف'};
function setst(l,id,a){l[id-1].st=a==='sus'?'suspended':a==='del'?'deleted':'active'}
function sbtn(k,id,x){return (x.st==='active'?'<button class="sw" data-'+k+'="'+id+':sus">إيقاف</button>':'<button class="sw" data-'+k+'="'+id+':act">'+(x.st==='deleted'?'استرجاع':'تفعيل')+'</button>')+(x.st==='deleted'?'':'<button class="sw" data-'+k+'="'+id+':del" style="color:var(--bad)">حذف</button>')}
function cmpH(l){return l.length?l.map(function(c){var a=S.cl[c.cl-1].n,b=S.nu[c.nu-1].n;return '<p style="padding:6px 0;border-bottom:1px solid var(--line)"><b>'+(c.from==='client'?'من '+a+' ضد '+b:'من '+b+' ضد '+a)+'</b> · <span class="mut">'+c.tm+'</span><br>'+c.txt+'<br>'+(c.st==='open'?'<button class="sw" data-cr="'+c.id+':w">تحذير</button> <button class="sw" data-cr="'+c.id+':f">خصم</button> <button class="sw" data-cr="'+c.id+':s">إيقاف الحساب</button>':'<span class="ok">اتقفلت: '+c.act+'</span>')+'</p>'}).join(''):'<span class="mut">مفيش شكاوى</span>'}
function kk(l,v){return '<div class="k"><span class="mut">'+l+'</span><b>'+v+'</b></div>'}
function row(x,k,sub,bad){return '<button class="svc" data-'+k+'="'+x.id+'" style="margin:0;border:0;border-bottom:1px solid var(--line);border-radius:0"><span class="av" style="width:36px;height:36px;font-size:1rem">'+x.n.charAt(0)+'</span><span class="t">'+x.n+'<small>'+sub+' · '+STN[x.st]+'</small></span>'+(bad?'<b style="color:var(--bad)">'+f(bad)+' شكوى</b>':'')+'</button>'}
function nlist(){return '<h2>الممرضين ('+f(S.nu.length)+')</h2><div class="card">'+S.nu.map(function(x){return row(x,'pn',tier(nv(x)),S.cmp.filter(function(c){return c.from==='client'&&c.nu===x.id&&c.st==='open'}).length)}).join('')+'</div>'}
function clist(){return '<h2>العملاء ('+f(S.cl.length)+')</h2><div class="card">'+S.cl.map(function(x){return row(x,'pc',f(S.ords.filter(function(o){return o.cl===x.id}).length)+' خدمة',S.cmp.filter(function(c){return c.from==='nurse'&&c.cl===x.id&&c.st==='open'}).length)}).join('')+'</div>'}
function npro(x){var os=S.ords.filter(function(o){return o.nu===x.id}),rs=os.filter(function(o){return o.rt}),av=rs.length?(rs.reduce(function(a,o){return a+o.rt},0)/rs.length).toFixed(1):'-',tt=os.reduce(function(a,o){return a+o.t},0),dc=x.id===1?S.docs:x.docs,dt=x.id===1?S.debt:x.debt;
var D=['شهادة التخرج','شهادة الامتياز','البطاقة (وش)','البطاقة (ضهر)','كارنيه النقابة','كارنيه المزاولة'];
return '<button class="sw" data-bk="1" style="margin-top:12px">‹ رجوع</button><div class="hero"><div class="row"><div><h1 style="font-size:1.5rem">'+x.n+'</h1><p>'+x.ph+' · '+tier(nv(x))+'</p></div><b>'+STN[x.st]+'</b></div></div><div class="card">'+sbtn('ns',x.id,x)+'</div><div class="grid">'+kk('الزيارات',f(os.length))+kk('متوسط التقييم',av==='-'?'-':'⭐ '+av)+kk('إجمالي التحصيل',f(tt)+' ج')+kk('مديونية',f(dt)+' ج')+'</div><h2>المستندات</h2><div class="card">'+D.map(function(d,i){return '<div class="row" style="padding:4px 0"><span>'+d+'</span><span class="'+(dc[i]?'ok':'')+'">'+(dc[i]?'مرفوع ✓':'ناقص')+'</span></div>'}).join('')+'</div><h2>الشكاوى ضده</h2><div class="card">'+cmpH(S.cmp.filter(function(c){return c.from==='client'&&c.nu===x.id}))+'</div><h2>شغله</h2><div class="card x"><table><tr><th>العميل</th><th>الخدمة</th><th>المبلغ</th><th>تقييم</th></tr>'+os.slice(-8).reverse().map(function(o){return '<tr><td>'+S.cl[o.cl-1].n+'</td><td>'+o.s+'</td><td>'+f(o.t)+'</td><td>'+(o.rt?'⭐'+o.rt:'-')+'</td></tr>'}).join('')+'</table></div>'}
function cpro(x){var os=S.ords.filter(function(o){return o.cl===x.id}),tt=os.reduce(function(a,o){return a+o.t},0);
return '<button class="sw" data-bk="1" style="margin-top:12px">‹ رجوع</button><div class="hero"><div class="row"><div><h1 style="font-size:1.5rem">'+x.n+'</h1><p>'+x.ph+'</p></div><b>'+STN[x.st]+'</b></div></div><div class="card">'+sbtn('cs',x.id,x)+'</div><div class="grid">'+kk('الخدمات',f(os.length))+kk('إجمالي الدفع',f(tt)+' ج')+kk('شكاوى ضده',f(S.cmp.filter(function(c){return c.from==='nurse'&&c.cl===x.id}).length))+kk('شكاوى قدّمها',f(S.cmp.filter(function(c){return c.from==='client'&&c.cl===x.id}).length))+'</div><h2>الشكاوى</h2><div class="card">'+cmpH(S.cmp.filter(function(c){return c.cl===x.id}))+'</div><h2>الخدمات اللي أخدها</h2><div class="card x"><table><tr><th>الممرض</th><th>الخدمة</th><th>المبلغ</th></tr>'+os.slice(-8).reverse().map(function(o){return '<tr><td>'+S.nu[o.nu-1].n+'</td><td>'+o.s+'</td><td>'+f(o.t)+'</td></tr>'}).join('')+'</table></div>'}
function admin(){var a=S.av||'o';return '<div class="tabs" style="position:static;margin-top:10px">'+[['o','نظرة عامة'],['n','الممرضين'],['c','العملاء'],['k','الشكاوى']].map(function(x){return '<button class="'+(a===x[0]?'on':'')+'" data-av="'+x[0]+'">'+x[1]+'</button>'}).join('')+'</div>'+(a==='n'?(S.pn?npro(S.nu[S.pn-1]):nlist()):a==='c'?(S.pc?cpro(S.cl[S.pc-1]):clist()):a==='k'?'<h2>كل الشكاوى</h2><div class="card">'+cmpH(S.cmp)+'</div>':adminOv())}
function eta(){return Math.max(1,12-Math.floor((Date.now()-(S.o.ta||Date.now()))/5000))}
function map(){var p=Math.min(1,(Date.now()-(S.o.ta||Date.now()))/60000);
return '<svg viewBox="0 0 300 90" width="100%" role="img" aria-label="موقع الممرض على الطريق" style="margin-top:10px;background:var(--bg);border-radius:12px"><line x1="30" y1="60" x2="270" y2="40" stroke="var(--line)" stroke-width="6" stroke-linecap="round"/><circle cx="270" cy="40" r="9" fill="var(--bad)"/><text x="270" y="72" text-anchor="middle" font-size="11" fill="var(--mut)">بيتك</text><circle cx="'+(30+240*p)+'" cy="'+(60-20*p)+'" r="9" fill="var(--gold)"/><text x="150" y="86" text-anchor="middle" font-size="10" fill="var(--mut)">تتبع مباشر (محاكاة)</text></svg>'}
var PL=[['متابعة كبار السن','٤ زيارات شهرياً · ضغط وسكر',4,500],['باقة الحقن الشهرية','٨ حقن بروشتة',8,1200],['رعاية بعد العملية','١٢ زيارة · جروح ومتابعة',12,2400]];
function plans(){var h='<h2>📦 الباقات</h2>';if(S.sub)h+='<div class="card"><b>'+S.sub.n+'</b><p class="ok">فاضل '+f(S.sub.left)+' زيارة</p></div>';

else if(d.ap!==undefined){if(S.pend[+d.ap]===N.name)S.reg='ok';S.pend.splice(+d.ap,1);S.ver++}
else if(d.f){FEE=Math.max(0,FEE+(+d.f)*10);S.fee=FEE}
else if(d.v){S.r15=Math.max(5,S.r15+(+d.v)*5)}
else if(d.np){S.np=d.np}
else if(d.doc!==undefined){S.docs[+d.doc]=S.docs[+d.doc]?0:1}
else if(d.pm){S.pm=d.pm}
else if(d.fam){S.fam=d.fam}
else if(d.av){S.av=d.av;S.pn=0;S.pc=0}
else if(d.pn){S.pn=+d.pn}
else if(d.pc){S.pc=+d.pc}
else if(d.bk){S.pn=0;S.pc=0}
else if(d.ns){var q1=d.ns.split(':');setst(S.nu,+q1[0],q1[1])}
else if(d.cs){var q3=d.cs.split(':');setst(S.cl,+q3[0],q3[1])}
else if(d.cr){var q2=d.cr.split(':'),cc=S.cmp.filter(function(z){return z.id===+q2[0]})[0];if(cc){cc.st='closed';cc.act=({w:'تحذير',f:'خصم',s:'إيقاف الحساب'})[q2[1]];if(q2[1]==='s'){if(cc.from==='client')setst(S.nu,cc.nu,'sus');else setst(S.cl,cc.cl,'sus')}}}
else if(d.pl!==undefined){var pp=PL[+d.pl];S.sub={n:pp[0],left:pp[2]};wa('العميل','تم الاشتراك في باقة '+pp[0])}
else if(d.is){var q=d.is.split(':'),x=S.inc.filter(function(y){return y.id===+q[0]})[0];if(x)x.sp[+q[1]]=x.sp[+q[1]]?0:1}
else if(d.ir){var y2=S.inc.filter(function(z){return z.id===+d.ir})[0];if(y2){y2.st='done';y2.rt=tmn()}}
else if(d.dd!==undefined){S.drs.splice(+d.dd,1)}
else if(d.p){PCT=Math.min(.6,Math.max(0,Math.round((PCT+(+d.p)*.05)*100)/100));S.pct=PCT}
else if(d.a){var a=d.a;
 if(a==='req'){S.o={st:'new',t:tot(),fx:tot(),names:names(),pm:S.pm,tm:!!S.sel[6],fam:S.fam,abr:S.abroad&&S.fam!=='لنفسي'};wa('الممرضين القريبين','طلب جديد: '+names());S.rate=0}
 else if(a==='cancel'||a==='rej'){S.o=a==='cancel'?null:S.o;if(a==='cancel')S.sel={}}
 else if(a==='acc'){S.o.st='accepted';S.o.ta=Date.now();wa(S.o.abr?'العميل (خارج مصر)':'العميل','الممرضة '+N.name+' قبلت الطلب وفي الطريق')}
 else if(a==='next'){var i=si();S.o.st=ST[i+1];
  if(S.o.st==='started'){S.o.t0=Date.now();S.o.off=0}
  if(S.o.st==='done'){var o=S.o,mn=el(o);o.mn=mn;o.t=bill(o);var cm=Math.round((o.t-FEE)*PCT),nt=o.t-cm;o.cm=cm;
   if(o.pm==='cash'){S.debt+=cm}else{S.bal=(S.bal||0)+nt}
   S.earn+=nt;if(S.sub&&S.sub.left>0)S.sub.left--;wa('العميل','فاتورة '+f(o.t)+' ج · '+pmn(o.pm));S.ords.push({id:200+S.ords.length,cl:1,nu:1,s:o.names,t:o.t,rt:0,pm:o.pm});S.log.push({id:100+S.log.length+1,s:o.names,t:o.t,n:'منى',pm:o.pm,mn:mn,cm:cm})}}
 else if(a==='ff'){S.o.off+=15}
 else if(a==='again'){S.o=null;S.sel={};S.rx=false;S.sos=false;S.nsos=false}
 else if(a==='tog'){S.on=!S.on}
 else if(a==='pay'){S.debt=0}
 else if(a==='rx'){S.rx=!S.rx}
 else if(a==='sign'){S.sign=!S.sign}
 else if(a==='sub'){S.reg='pending';S.pend.unshift(N.name)}
 else if(a==='newn'){S.reg='new';S.docs=[0,0,0,0,0,0];S.sign=false}
 else if(a==='sos'){S.sos=true;mkinc('العميل')}
 else if(a==='abr'){S.abroad=!S.abroad}
 else if(a==='cmpc'){var ct=esc(document.getElementById('cmt').value.trim());if(ct){S.cmp.unshift({id:S.cmp.length+1,from:'client',cl:1,nu:1,txt:ct,st:'open',tm:tmn()});S.o.cm=true;wa('إدارة الشركة','شكوى جديدة من العميل')}}
 else if(a==='rep'){var bp=esc(document.getElementById('rb').value.trim()),sg=esc(document.getElementById('rs').value.trim()),nt=esc(document.getElementById('rn').value.trim());S.o.rep={bp:bp,sg:sg,nt:nt};S.recs.unshift({d:tmn(),svc:S.o.names,bp:bp,sg:sg,nt:nt,w:S.o.fam});wa(S.o.abr?'العميل (خارج مصر)':'العميل','تقرير الزيارة: ضغط '+bp+' · سكر '+sg);var cm2=esc(document.getElementById('cmn').value.trim());if(cm2){S.cmp.unshift({id:S.cmp.length+1,from:'nurse',cl:1,nu:1,txt:cm2,st:'open',tm:tmn()});wa('إدارة الشركة','شكوى جديدة من الممرض')}}
 else if(a==='adc'){var cn=esc(document.getElementById('cn').value.trim()),ce=+document.getElementById('ce').value,cp=+document.getElementById('cp').value;if(cn&&ce>0&&cp>0)S.co.push({n:cn,e:ce,v:2,p:cp})}
 else if(a==='sosn'){S.nsos=true;mkinc('الممرض')}
 else if(a==='adr'){var n1=document.getElementById('dn').value.trim(),p1=document.getElementById('dp').value.trim();if(n1&&p1)S.drs.push({n:esc(n1),sp:'استشاري',ph:p1})}
}
sv();render()});
render();
setInterval(function(){if(S.o&&(S.m==='c'||S.m==='n')&&(S.o.st==='accepted'||(S.o.st==='started'&&S.o.tm)))render()},4000);
try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')}catch(e){}
</script>
