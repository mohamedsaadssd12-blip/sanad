<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سَنَد – تمريض منزلي</title>
<meta name="theme-color" content="#0F1B2D"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F4F6;--card:#fff;--ink:#0F1B2D;--mut:#667085;--gold:#A8843E;--line:#E2E5EA;--ok:#2E8F76;--bad:#C2503D;--hero:#0F1B2D;--herotx:#F3F4F6;--herogold:#D8B974;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0A1220;--card:#121E32;--ink:#EEF0F4;--mut:#93A0B5;--gold:#D8B974;--line:#22314A;--ok:#4FC3A5;--bad:#F08A76;--hero:#16243D}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Readex Pro',system-ui,sans-serif;line-height:1.7;font-size:15px}
main{max-width:480px;margin:0 auto;padding:12px 16px 60px}
.tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin-top:10px}
.tabs button{flex:1;background:none;color:var(--mut);border:0;border-radius:10px;padding:8px 2px;font:inherit;font-size:.82rem;font-weight:600;cursor:pointer;min-height:44px}
.tabs button.on{background:var(--hero);color:var(--herotx)}
.hero{background:var(--hero);color:var(--herotx);border-radius:22px;padding:22px 20px;margin-top:12px}
.hero h1{font-size:1.7rem;font-weight:700;line-height:1.3;color:var(--herogold)}.hero p{opacity:.8;font-weight:300}
h2{font-size:1.05rem;font-weight:700;margin:18px 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px}
.svc{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:8px;font:inherit;cursor:pointer;min-height:52px}
.svc.on{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}.svc .t{flex:1}.svc small{display:block;color:var(--mut);font-weight:300}.svc b{color:var(--gold)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:13px;font:inherit;font-weight:700;background:var(--hero);color:var(--herotx);cursor:pointer;margin-top:12px;min-height:48px}
.btn.g{background:var(--gold);color:#0F1B2D}.btn.o{background:none;color:var(--ink);border:1.5px solid var(--line)}.btn:disabled{opacity:.4}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.mut{color:var(--mut);font-weight:300}.gold{color:var(--gold);font-weight:700}.ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}
.steps{display:flex;gap:6px;margin-top:10px}.steps i{flex:1;height:5px;border-radius:9px;background:var(--line)}.steps i.on{background:var(--gold)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.k{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}.k b{display:block;font-size:1.25rem}
.sw{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font:inherit;cursor:pointer;min-height:40px;display:inline-block;margin:3px 3px 0 0}
.sw.on{background:var(--ok);color:#fff;border-color:var(--ok)}
input,textarea{width:100%;font:inherit;padding:11px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:.85rem}td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}th{color:var(--mut);font-weight:400}.x{overflow-x:auto}
.toast{position:fixed;inset:auto 16px calc(16px + env(safe-area-inset-bottom,0px));max-width:440px;margin:auto;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:600;text-align:center;z-index:2000}
.st button{background:none;border:0;font-size:1.8rem;cursor:pointer;color:var(--line);min-width:44px;min-height:44px}.st button.on{color:var(--gold)}
.av{width:46px;height:46px;border-radius:50%;background:var(--hero);color:var(--herogold);display:grid;place-items:center;font-weight:700;flex:none}
a{color:var(--gold)}
</style>
</head>
<body>
<main id="v"></main>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
var SB=supabase.createClient('https://tsxvmmzhqrpwostxlgce.supabase.co','sb_publishable_lH02LIooEUgGRjnlNlPduw_vjt3lSbj');
var S={u:null,p:null,d:{},mode:'in',role:'client',sel:{},fam:'لنفسي',pm:'cash',abr:false,sign:false,tab:'o',view:null,toast:'',j:'',urls:{},np:null,loc:null,pv:false};
var PM={cash:'كاش',insta:'إنستاباي',wal:'محفظة',card:'حساب بنكي'};
var STL={new:'بندوّر على ممرض…',accepted:'الممرض في الطريق',arrived:'الممرض وصل',started:'الخدمة جارية',done:'تمت الخدمة',cancelled:'اتلغى'};
var SI=['accepted','arrived','started','done'];
var DOCS=[['grad','شهادة التخرج'],['intern','شهادة الامتياز'],['id_front','البطاقة (وش)'],['id_back','البطاقة (ضهر)'],['syndicate','كارنيه النقابة'],['license','كارنيه المزاولة']];
var STP=['اتصلت بالعميل','اتصلت بالممرض','استدعيت الإسعاف ١٢٣','أوقفت الحساب'];
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function f(n){return Number(n||0).toLocaleString('ar-EG')}
function q(r){if(r.error)throw r.error;return r.data}
function val(i){var e=document.getElementById(i);return e?e.value.trim():''}
function card(x){return '<div class="card">'+x+'</div>'}
function hero(t,s){return '<div class="hero"><h1>'+t+'</h1><p>'+s+'</p></div>'}
function bar(s){var i=SI.indexOf(s),h='<div class="steps">';for(var k=0;k<4;k++)h+='<i class="'+(k<=i?'on':'')+'"></i>';return h+'</div>'}
function B(a,t,c){return '<button class="'+(c||'btn')+'" data-a="'+a+'">'+t+'</button>'}
function K(l,v){return '<div class="k"><span class="mut">'+l+'</span><b>'+v+'</b></div>'}
function nrs(p){return Array.isArray(p.nurses)?p.nurses[0]||{}:p.nurses||{}}
function pn(id){var x=(S.d.pr||[]).filter(function(p){return p.id===id})[0];return x?esc(x.name||'—'):'—'}
function svn(o){return (o.services||[]).map(esc).join(' + ')}
function say(t){S.toast=t;render();setTimeout(function(){S.toast='';render()},3500)}

/* ---------- تحميل البيانات ---------- */
async function load(force){
  if(!S.u)return;
  var p=q(await SB.from('profiles').select('*,nurses(*)').eq('id',S.u.id).single()),d={};
  d.cf=q(await SB.from('settings').select('*').single());
  var oj='*,nurse:profiles!nurse_id(name,phone,nurses(rating,visits)),client:profiles!client_id(name,phone)';
  if(p.role==='client'){
    d.sv=q(await SB.from('services').select('*').eq('active',true).order('id'));
    d.o=q(await SB.from('orders').select(oj).eq('client_id',S.u.id).order('id',{ascending:false}).limit(15));
  }else if(p.role==='nurse'){
    var n=nrs(p);
    if(n.reg_status==='ok'){
      d.nw=q(await SB.from('orders').select(oj).eq('status','new').order('id'));
      d.o=q(await SB.from('orders').select(oj).eq('nurse_id',S.u.id).order('id',{ascending:false}).limit(15));
    }else if(n.reg_status==='new'){
      d.up={};var fl=q(await SB.storage.from('nurse-docs').list(S.u.id));(fl||[]).forEach(function(x){d.up[x.name.split('.')[0]]=S.u.id+'/'+x.name});
    }
  }else{
    d.pr=q(await SB.from('profiles').select('*,nurses(*)').order('created_at',{ascending:false}));
    d.o=q(await SB.from('orders').select(oj).order('id',{ascending:false}).limit(200));
    d.cm=q(await SB.from('complaints').select('*').order('id',{ascending:false}));
    d.in=q(await SB.from('incidents').select('*').order('id',{ascending:false}));
  }
  if(p.role!=='nurse'||nrs(p).reg_status==='ok'){var rp=q(await SB.from('reports').select('*'));d.rp={};rp.forEach(function(r){d.rp[r.order_id]=r});var ol=q(await SB.from('order_loc').select('*'));d.ol={};ol.forEach(function(r){d.ol[r.order_id]=r})}
  if(p.role==='nurse'&&nrs(p).reg_status==='ok')track();
  var j=JSON.stringify([p,d,Math.floor(Date.now()/60000),S.np?S.np.lat.toFixed(4)+S.np.lng.toFixed(4):'']);
  if(force||j!==S.j){S.j=j;S.p=p;S.d=d;render()}
}
async function run(fn){try{await fn();await load(true)}catch(e){say(e.message||'حصل خطأ')}}

function na(x){var n=x&&x.nurses;return Array.isArray(n)?n[0]||{}:n||{}}
function tier(v){return v>=30?'🥇 ذهبي':v>=10?'🥈 فضي':'🥉 برونزي'}
function dist(a,b){var R=6371,t=Math.PI/180,dl=(b.lat-a.lat)*t,dn=(b.lng-a.lng)*t,x=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dn/2)*Math.sin(dn/2);return 2*R*Math.asin(Math.sqrt(x))}
function tel(ph){var d=String(ph).replace(/\D/g,''),w=d.charAt(0)==='0'?'2'+d:d;return '<a class="sw" href="tel:'+esc(ph)+'">📞 اتصال</a><a class="sw" target="_blank" rel="noopener" href="https://wa.me/'+w+'">💬 واتساب</a>'}
function getPos(){return new Promise(function(res,rej){if(!navigator.geolocation)return rej(new Error('المتصفح لا يدعم تحديد الموقع'));navigator.geolocation.getCurrentPosition(function(p){res({lat:p.coords.latitude,lng:p.coords.longitude})},function(){rej(new Error('اسمح للتطبيق بالوصول لموقعك من إعدادات المتصفح'))},{enableHighAccuracy:true,timeout:15000})})}
function track(){if(S.tw||!navigator.geolocation)return;S.tw=navigator.geolocation.watchPosition(function(p){S.np={lat:p.coords.latitude,lng:p.coords.longitude}},function(){},{enableHighAccuracy:true,maximumAge:5000})}
function sendLoc(){var o=S.d&&S.d.o,a=S.p&&S.p.role==='nurse'&&o&&o.filter(function(x){return x.status==='accepted'||x.status==='arrived'})[0];if(!a||!S.np||Date.now()-(S.ls||0)<7000)return;S.ls=Date.now();SB.rpc('update_location',{p_id:a.id,p_lat:S.np.lat,p_lng:S.np.lng}).then(function(){})}
var MAP=null,MEL=null,MK={};
function mk(k,pt,em){if(!pt){if(MK[k]){MAP.removeLayer(MK[k]);MK[k]=null}return}var ll=[pt.lat,pt.lng];if(MK[k])MK[k].setLatLng(ll);else MK[k]=L.marker(ll,{icon:L.divIcon({html:'<div style="font-size:26px;line-height:30px">'+em+'</div>',className:'',iconSize:[30,30],iconAnchor:[15,15]})}).addTo(MAP)}
function mapFor(a,b){var ph=document.getElementById('mph');if(!ph||!window.L)return;
 if(!MEL){MEL=document.createElement('div');MEL.style.cssText='height:240px;border-radius:14px;margin-top:10px';MAP=L.map(MEL).setView([a.lat,a.lng],14);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(MAP)}
 ph.replaceWith(MEL);MAP.invalidateSize();mk('c',a,'🏠');mk('n',b,'🩺');
 var key=a.lat+','+a.lng+(b?'|'+b.lat.toFixed(3)+','+b.lng.toFixed(3):'');
 if(MAP._k!==key){MAP._k=key;if(b)MAP.fitBounds([[a.lat,a.lng],[b.lat,b.lng]],{padding:[30,30],maxZoom:16});else MAP.setView([a.lat,a.lng],15)}}
function etaTxt(o,ol){if(o.nurse_lat==null||!ol)return 'بستنى موقع الممرض…';if(o.status==='arrived')return 'الممرض وصل';var k=dist({lat:+o.nurse_lat,lng:+o.nurse_lng},{lat:+ol.lat,lng:+ol.lng});return 'يبعد '+f(Math.round(k*10)/10)+' كم · حوالي '+f(Math.max(1,Math.round(k/25*60)))+' دقيقة'}
function nurseCard(n){var x=na(n),v=x.visits||0;return '<div class="row" style="justify-content:flex-start;gap:12px"><div class="av">'+esc((n.name||'م').charAt(0))+'</div><div style="flex:1"><b>'+esc(n.name||'ممرض')+'</b> <span class="ok">✓ موثّق</span><div class="mut">'+(x.rating?'⭐ '+x.rating:'جديد')+' · '+f(v)+' زيارة · '+tier(v)+'</div></div></div>'+(n.phone?'<div>'+tel(n.phone)+'</div>':'')}
function navBlock(o){var ol=S.d.ol&&S.d.ol[o.id];if(!ol)return '';S.mp={a:{lat:+ol.lat,lng:+ol.lng},b:S.np};return card('<b>📍 العنوان</b><p>'+esc(ol.addr||'—')+'</p><a class="sw" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination='+ol.lat+','+ol.lng+'">🧭 افتح الاتجاهات</a><div id="mph"></div>')}
function profV(){var p=S.p,fo=!p.name||!p.phone;return hero(fo?'كمّل بياناتك':'بياناتي','الاسم والموبايل بيظهروا للطرف التاني في الزيارة')+card('<label class="mut">الاسم</label><input id="pn" value="'+esc(p.name)+'" placeholder="الاسم"><label class="mut">الموبايل</label><input id="pp" value="'+esc(p.phone)+'" inputmode="tel" placeholder="01xxxxxxxxx"><p class="mut">الإيميل: '+esc(S.u.email)+'</p>'+B('savep','حفظ','btn g')+(fo?'':B('prof','رجوع','btn o')))}
/* ---------- الدخول ---------- */
function authV(){var up=S.mode==='up';
return hero('سَنَد','تمريض منزلي بمستوى فندقي')+card('<div class="tabs" style="margin-top:0">'+B('m:in','دخول',up?'':'on')+B('m:up','حساب جديد',up?'on':'')+'</div>'
+(up?'<input id="nm" placeholder="الاسم"><input id="ph" placeholder="رقم الموبايل" inputmode="tel"><div class="grid">'+B('r:client','عميل','svc'+(S.role==='client'?' on':''))+B('r:nurse','ممرض','svc'+(S.role==='nurse'?' on':''))+'</div>':'')
+'<input id="em" type="email" placeholder="الإيميل" autocomplete="email"><input id="pw" type="password" placeholder="الباسوورد (٦ حروف على الأقل)" autocomplete="current-password">'+B(up?'su':'si',up?'إنشاء الحساب':'دخول','btn g'))}

/* ---------- العميل ---------- */
function clientV(){
var p=S.p,d=S.d,o=d.o||[],ac=o.filter(function(x){return ['new','accepted','arrived','started'].indexOf(x.status)>-1})[0];
if(S.pv||!p.name||!p.phone)return profV();
var h=hero('أهلاً '+esc(p.name||''),'ممرض مرخّص يوصلك البيت')+B('prof','بياناتي','sw')+B('out','خروج','sw');
if(p.status!=='active')return h+card('<b class="bad">حسابك موقوف. تواصل مع الشركة.</b>');
if(ac)h+=activeC(ac);
else{
 var ld=o[0];
 if(ld&&ld.status==='done'&&!localStorage.getItem('sd'+ld.id))h+=doneC(ld);
 h+='<h2>اختار الخدمة</h2>';
 var t=0,fee=d.cf.visit_fee;
 (d.sv||[]).forEach(function(s){var on=S.sel[s.id];if(on)t+=Number(s.price);h+='<button class="svc'+(on?' on':'')+'" data-a="sel:'+s.id+'"><span class="t">'+esc(s.name)+'</span><b>'+(s.time_based?'بالوقت':f(s.price)+' ج')+'</b></button>'});
 var any=Object.keys(S.sel).some(function(k){return S.sel[k]});
 h+='<h2>الزيارة لمين؟</h2><div class="grid">'+['لنفسي','ماما','بابا'].map(function(w){return B('fam:'+w,w,'svc'+(S.fam===w?' on':''))}).join('')+'</div>';
 if(S.fam!=='لنفسي')h+=B('abr','✈️ أنا خارج مصر، ابعتلي التقرير','svc'+(S.abr?' on':''));
 h+='<h2>طريقة الدفع</h2><div class="grid">'+Object.keys(PM).map(function(k){return B('pm:'+k,PM[k],'svc'+(S.pm===k?' on':''))}).join('')+'</div>';
 h+=card('<div class="row"><span class="mut">رسوم الزيارة</span><span>'+f(fee)+' ج</span></div><div class="row"><b>الإجمالي</b><span class="gold">'+(any?f(t+Number(fee)):'—')+' ج</span></div>'+(S.sel[6]?'<p class="mut">المحلول: '+f(d.cf.iv_rate15)+' ج كل ربع ساعة، بيتحسب بالوقت الفعلي.</p>':''));
 h+=card('<b>📍 موقعك</b><p class="mut">'+(S.loc?'تم تحديد موقعك ✓':'لازم نحدد موقعك عشان الممرض يوصلك')+'</p>'+B('loc',S.loc?'تحديث الموقع':'حدّد موقعي','sw'+(S.loc?' on':''))+'<input id="ad" placeholder="العنوان بالتفصيل (عمارة، دور، شقة)">');
 h+='<button class="btn g" data-a="req"'+(any&&S.loc?'':' disabled')+'>اطلب ممرض الآن</button>';
 var hs=o.filter(function(x){return x.status==='done'||x.status==='cancelled'});
 if(hs.length)h+='<h2>طلباتي السابقة</h2>'+card(hs.map(function(x){return '<div class="row" style="padding:5px 0"><span>'+svn(x)+'<br><small class="mut">'+new Date(x.created_at).toLocaleDateString('ar-EG')+' · '+STL[x.status]+'</small></span><b>'+(x.total?f(x.total)+' ج':'—')+'</b></div>'}).join(''));
}
return h}
function activeC(o){
var ol=S.d.ol&&S.d.ol[o.id],n=o.nurse,live=o.status==='accepted'||o.status==='arrived';
var h=card('<b>'+svn(o)+'</b>'+bar(o.status)+'<p style="margin-top:8px"><b>'+STL[o.status]+'</b></p>'+(live?'<p class="gold">'+etaTxt(o,ol)+'</p>':'')
+(o.status==='started'&&o.time_based?'<p class="gold">مضى '+f(Math.floor((Date.now()-new Date(o.started_at))/60000))+' دقيقة</p>':'')
+'<div class="row"><span class="mut">'+PM[o.pay_method]+'</span><span class="gold">'+f(o.fixed_amount)+' ج'+(o.time_based?' + المحلول':'')+'</span></div>');
if(n)h+=card(nurseCard(n));
if(live&&ol){S.mp={a:{lat:+ol.lat,lng:+ol.lng},b:o.nurse_lat!=null?{lat:+o.nurse_lat,lng:+o.nurse_lng}:null};h+='<div id="mph"></div>'}
h+=(o.status==='new'||o.status==='accepted'?B('cancel:'+o.id,'إلغاء الطلب','btn o'):'');
h+=(o.status!=='new'?B('sos:'+o.id,'🚨 طوارئ','btn o').replace('class="btn o"','class="btn o" style="color:var(--bad)"'):'');
return h}
function doneC(o){var r=S.d.rp[o.id],h='<div class="card" style="text-align:center"><h2>تمت الخدمة ✓</h2><p class="gold">'+f(o.total)+' ج · '+PM[o.pay_method]+'</p>'
+(o.time_based?'<p class="mut">مدة المحلول '+f(o.minutes)+' دقيقة</p>':'')
+(r?'<p>🩺 ضغط '+esc(r.bp)+' · سكر '+esc(r.sugar)+(r.notes?'<br>'+esc(r.notes):'')+'</p>':'<p class="mut">الممرض بيكتب تقرير الزيارة…</p>');
if(o.rating)h+='<p class="ok">تقييمك: '+'★'.repeat(o.rating)+'</p>';
else{h+='<div class="st">';for(var i=1;i<=5;i++)h+='<button data-a="rate:'+o.id+':'+i+'" aria-label="'+i+'">★</button>';h+='</div>'}
h+='<input id="cmt" placeholder="عندك شكوى؟ اكتبها هنا">'+B('cmp:'+o.id,'أرسل الشكوى','btn o')+B('dis:'+o.id,'طلب جديد','btn g')+'</div>';
return h}

/* ---------- الممرض ---------- */
function nurseV(){
var p=S.p,n=nrs(p),d=S.d;
if(S.pv||!p.name||!p.phone)return profV();
var h=hero(esc(p.name||'ممرض'),'سَنَد للممرضين')+B('prof','بياناتي','sw')+B('out','خروج','sw');
if(p.status!=='active')return h+card('<b class="bad">حسابك موقوف. تواصل مع الشركة.</b>');
if(n.reg_status==='pending')return h+card('<b>طلبك قيد المراجعة</b><p class="mut">هتوصلك الموافقة من الشركة بعد مراجعة المستندات.</p>');
if(n.reg_status==='new'){
 var up=d.up||{},all=DOCS.every(function(x){return up[x[0]]});
 h+='<h2>ارفع مستنداتك</h2>'+card(DOCS.map(function(x){return '<div class="row" style="padding:5px 0"><span>'+x[1]+'</span><label class="sw'+(up[x[0]]?' on':'')+'">'+(up[x[0]]?'تم ✓':'ارفع')+'<input type="file" accept="image/*" data-doc="'+x[0]+'" hidden></label></div>'}).join(''));
 h+='<h2>عقد الانضمام</h2>'+card('<p>١. ألتزم بسداد نسبة الشركة في موعدها.<br>٢. لا أتفق مع أي عميل جاني من الشركة على العمل خارج التطبيق.<br>٣. أقدّم الخدمات في حدود ترخيصي فقط.</p>'+B('sign',S.sign?'وقّعت ✓':'أوافق وأوقّع','sw'+(S.sign?' on':'')));
 return h+'<button class="btn g" data-a="subn"'+(all&&S.sign?'':' disabled')+'>أرسل للمراجعة</button>'}
var o=d.o||[],ac=o.filter(function(x){return ['accepted','arrived','started'].indexOf(x.status)>-1})[0],ld=o[0];
h+='<div class="grid">'+K('رصيد قابل للسحب',f(n.balance)+' ج')+K('مستحق للشركة',f(n.debt)+' ج')+K('زيارات',f(n.visits))+K('تقييم',n.rating?'⭐ '+n.rating:'—')+'</div>';
if(ac){
 var nx={accepted:'وصلت للعميل',arrived:'ابدأ الخدمة',started:'أنهِ الخدمة'}[ac.status];
 h+='<h2>الزيارة الحالية</h2>'+card('<b>'+svn(ac)+'</b>'+(ac.for_whom!=='لنفسي'&&ac.for_whom!=='self'?'<span class="gold"> · لـ'+esc(ac.for_whom)+'</span>':'')+bar(ac.status)
 +'<p class="mut">العميل: '+esc(ac.client?ac.client.name:'')+(ac.client&&ac.client.phone?' · <a href="tel:'+esc(ac.client.phone)+'">'+esc(ac.client.phone)+'</a>':'')+'</p>'
 +'<p class="mut">'+(ac.pay_method==='cash'?'حصّل كاش':'مدفوع أونلاين ('+PM[ac.pay_method]+')')+': '+f(ac.fixed_amount)+' ج'+(ac.time_based?' + المحلول بالوقت':'')+'</p>'
 +(ac.status==='started'&&ac.time_based?'<p class="gold">مضى '+f(Math.floor((Date.now()-new Date(ac.started_at))/60000))+' دقيقة</p>':''));
 h+=navBlock(ac)+B('adv:'+ac.id,nx,'btn g')+B('sos:'+ac.id,'🚨 طوارئ','btn o').replace('class="btn o"','class="btn o" style="color:var(--bad)"');
}else{
 if(ld&&ld.status==='done'&&!d.rp[ld.id])h+='<h2>تقرير الزيارة</h2>'+card('<input id="rb" placeholder="الضغط (مثال ١٢٠/٨٠)"><input id="rs" placeholder="السكر (مثال ١١٠)"><input id="rn" placeholder="ملاحظات"><input id="cmn" placeholder="شكوى ضد العميل (اختياري)">'+B('rep:'+ld.id,'احفظ وأرسل','btn g'));
 var nw=d.nw||[];
 h+='<h2>طلبات قريبة ('+f(nw.length)+')</h2>';
 if(!nw.length)h+=card('<span class="mut">مستني طلبات جديدة…</span>');
 var fee=Number(d.cf.visit_fee),cm=Number(d.cf.commission);
 nw.forEach(function(x){h+=card('<b>'+svn(x)+'</b>'+(x.for_whom!=='self'&&x.for_whom!=='لنفسي'?'<span class="gold"> · لـ'+esc(x.for_whom)+'</span>':'')+'<div class="row mut"><span>'+PM[x.pay_method]+(S.np&&x.area_lat!=null?' · '+f(Math.round(dist(S.np,{lat:+x.area_lat,lng:+x.area_lng})*10)/10)+' كم':'')+'</span><span>دخلك: <span class="ok">'+f(x.fixed_amount-Math.round((x.fixed_amount-fee)*cm))+' ج</span>'+(x.time_based?' + المحلول':'')+'</span></div>'+B('acc:'+x.id,'اقبل','btn g'))});
}
return h}

/* ---------- الإدارة ---------- */
function stBtns(id,st){return (st==='active'?B('ps:'+id+':suspended','إيقاف','sw'):B('ps:'+id+':active',st==='deleted'?'استرجاع':'تفعيل','sw'))+(st==='deleted'?'':B('ps:'+id+':deleted','حذف','sw'))}
function cmH(l){return l.length?l.map(function(c){return '<p style="padding:6px 0;border-bottom:1px solid var(--line)"><b>'+(c.from_role==='client'?'من '+pn(c.client_id)+' ضد '+pn(c.nurse_id):'من '+pn(c.nurse_id)+' ضد '+pn(c.client_id))+'</b><br>'+esc(c.body)+'<br>'+(c.status==='open'?B('cr:'+c.id+':تحذير','تحذير','sw')+B('cr:'+c.id+':خصم','خصم','sw')+B('cr:'+c.id+':إيقاف','إيقاف الحساب','sw'):'<span class="ok">اتقفلت: '+esc(c.action)+'</span>')+'</p>'}).join(''):'<span class="mut">مفيش شكاوى</span>'}
function admin(){
var d=S.d,t=S.tab,tabs=[['o','نظرة'],['n','ممرضين'],['c','عملاء'],['k','شكاوى'],['i','طوارئ'],['r','طلبات']];
var h=hero('لوحة الشركة','تحكم كامل')+B('out','خروج','sw')+'<div class="tabs">'+tabs.map(function(x){return B('t:'+x[0],x[1],t===x[0]&&!S.view?'on':'')}).join('')+'</div>';
var pr=d.pr||[],od=d.o||[],done=od.filter(function(x){return x.status==='done'});
if(S.view)return h+detail(S.view);
if(t==='o'){
 var g=0,c=0;done.forEach(function(x){g+=Number(x.total);c+=Number(x.commission)});
 var debt=0;pr.forEach(function(p){if(p.role==='nurse')debt+=Number(nrs(p).debt||0)});
 var pend=pr.filter(function(p){return p.role==='nurse'&&nrs(p).reg_status==='pending'});
 h+='<div class="grid">'+K('إجمالي الحجوزات',f(g)+' ج')+K('عمولة الشركة',f(c)+' ج')+K('مستحق عند الممرضين',f(debt)+' ج')+K('طلبات مكتملة',f(done.length))+K('طوارئ مفتوحة',f((d.in||[]).filter(function(x){return x.status==='open'}).length))+K('شكاوى مفتوحة',f((d.cm||[]).filter(function(x){return x.status==='open'}).length))+'</div>';
 h+='<h2>طلبات انضمام ('+f(pend.length)+')</h2>'+card(pend.length?pend.map(function(p){return '<div class="row" style="padding:5px 0"><span>'+esc(p.name)+'</span>'+B('v:n:'+p.id,'مراجعة','sw')+'</div>'}).join(''):'<span class="mut">مفيش</span>');
 var cf=d.cf;
 h+='<h2>الإعدادات</h2>'+card('<label class="mut">العمولة ٪</label><input id="s1" type="number" value="'+Math.round(cf.commission*100)+'"><label class="mut">رسوم الزيارة (للممرض)</label><input id="s2" type="number" value="'+cf.visit_fee+'"><label class="mut">المحلول لكل ربع ساعة</label><input id="s3" type="number" value="'+cf.iv_rate15+'"><label class="mut">حد المديونية</label><input id="s4" type="number" value="'+cf.debt_limit+'">'+B('set','حفظ الإعدادات','btn g'));
}else if(t==='n'||t==='c'){
 var ls=pr.filter(function(p){return p.role===(t==='n'?'nurse':'client')});
 h+='<h2>'+(t==='n'?'الممرضين':'العملاء')+' ('+f(ls.length)+')</h2>'+card(ls.length?ls.map(function(p){var n=nrs(p);return '<button class="svc" data-a="v:'+t+':'+p.id+'" style="margin:0;border:0;border-bottom:1px solid var(--line);border-radius:0"><span class="t">'+esc(p.name||'—')+'<small>'+(t==='n'?({new:'غير مكتمل',pending:'قيد المراجعة',ok:'موثّق'})[n.reg_status]+' · ':'')+({active:'نشط',suspended:'موقوف',deleted:'محذوف'})[p.status]+'</small></span></button>'}).join(''):'<span class="mut">لسه مفيش</span>');
}else if(t==='k'){h+='<h2>الشكاوى</h2>'+card(cmH(d.cm||[]))}
else if(t==='i'){
 h+='<h2>الطوارئ</h2>'+((d.in||[]).length?(d.in||[]).map(function(x){var s=x.steps&&x.steps.length?x.steps:[0,0,0,0];return card('<b class="'+(x.status==='open'?'bad':'ok')+'">'+(x.status==='open'?'🚨 مفتوح':'اتقفل')+' #'+x.id+'</b><p>من '+(x.by_role==='client'?'العميل':'الممرض')+' · '+pn(x.raised_by)+' · '+new Date(x.created_at).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})+'</p>'+(x.status==='open'?STP.map(function(l,i){return B('is:'+x.id+':'+i,l+(s[i]?' ✓':''),'sw'+(s[i]?' on':''))}).join('')+B('ir:'+x.id,'تم التعامل','btn g'):'<span class="mut">'+STP.filter(function(l,i){return s[i]}).join('، ')+'</span>'))}).join(''):card('<span class="mut">مفيش حوادث</span>'));
}else{
 h+='<h2>آخر الطلبات</h2><div class="card x"><table><tr><th>#</th><th>الخدمة</th><th>الحالة</th><th>المبلغ</th><th>عمولة</th></tr>'+od.slice(0,40).map(function(x){return '<tr><td>'+f(x.id)+'</td><td>'+svn(x)+'</td><td>'+STL[x.status]+'</td><td>'+(x.total?f(x.total):'—')+'</td><td>'+(x.commission!=null?f(x.commission):'—')+'</td></tr>'}).join('')+'</table></div>';
}
return h}
function detail(V){
var d=S.d,p=(d.pr||[]).filter(function(x){return x.id===V.id})[0];if(!p)return B('bk','‹ رجوع','sw');
var n=nrs(p),isN=p.role==='nurse',os=(d.o||[]).filter(function(x){return (isN?x.nurse_id:x.client_id)===p.id}),dn=os.filter(function(x){return x.status==='done'});
var tt=dn.reduce(function(a,x){return a+Number(x.total)},0),cs=(d.cm||[]).filter(function(c){return (isN?c.nurse_id:c.client_id)===p.id});
var h=B('bk','‹ رجوع','sw')+hero(esc(p.name||'—'),esc(p.phone||'')+' · '+({active:'نشط',suspended:'موقوف',deleted:'محذوف'})[p.status])+card(stBtns(p.id,p.status)+(isN&&n.reg_status==='pending'?B('ap:'+p.id,'وافق على الانضمام ✓','btn g'):''));
h+='<div class="grid">'+K('الخدمات',f(dn.length))+K('الإجمالي',f(tt)+' ج')+(isN?K('تقييم',n.rating?'⭐ '+n.rating:'—')+K('مديونية',f(n.debt)+' ج'):K('شكاوى',f(cs.length)))+'</div>';
if(isN){
 h+=card(B('dc:'+p.id,'عرض المستندات','sw')+(n.debt>0?B('pd:'+p.id,'تسجيل سداد المديونية','sw'):'')+(S.urls[p.id]?'<p>'+S.urls[p.id].map(function(u){return '<a href="'+u.u+'" target="_blank" rel="noopener">'+esc(u.n)+'</a>'}).join(' · ')+'</p>':''));
}
h+='<h2>الشكاوى</h2>'+card(cmH(cs))+'<h2>الطلبات</h2><div class="card x"><table><tr><th>'+(isN?'العميل':'الممرض')+'</th><th>الخدمة</th><th>المبلغ</th></tr>'+os.slice(0,10).map(function(x){return '<tr><td>'+esc((isN?x.client:x.nurse)?(isN?x.client:x.nurse).name:'—')+'</td><td>'+svn(x)+'</td><td>'+(x.total?f(x.total):'—')+'</td></tr>'}).join('')+'</table></div>';
return h}

/* ---------- الرسم ---------- */
function render(){
S.mp=null;var h=!S.u?authV():!S.p?card('<span class="mut">جاري التحميل…</span>'):S.p.role==='admin'?admin():S.p.role==='nurse'?nurseV():clientV();
document.getElementById('v').innerHTML=h+(S.toast?'<div class="toast" role="status">'+esc(S.toast)+'</div>':'');
if(S.mp)mapFor(S.mp.a,S.mp.b)}

/* ---------- الأحداث ---------- */
document.addEventListener('click',function(e){
var b=e.target.closest('button');if(!b||!b.dataset.a)return;
var a=b.dataset.a.split(':'),c=a[0],x=a[1],y=a[2],uid=S.u&&S.u.id;
if(c==='m'){S.mode=x;return render()}
if(c==='r'){S.role=x;return render()}
if(c==='t'){S.tab=x;S.view=null;return render()}
if(c==='v'){S.view={t:x,id:y};S.tab=x;return render()}
if(c==='bk'){S.view=null;return render()}
if(c==='sel'){S.sel[x]=!S.sel[x];return render()}
if(c==='fam'){S.fam=x;if(x==='لنفسي')S.abr=false;return render()}
if(c==='pm'){S.pm=x;return render()}
if(c==='abr'){S.abr=!S.abr;return render()}
if(c==='sign'){S.sign=!S.sign;return render()}
if(c==='dis'){localStorage.setItem('sd'+x,'1');return render()}
if(c==='prof'){S.pv=!S.pv;return render()}
if(c==='loc')return run(async function(){S.loc=await getPos()});
if(c==='savep')return run(async function(){var nm=val('pn'),ph=val('pp');if(!nm||!ph)throw new Error('اكتب الاسم والموبايل');q(await SB.from('profiles').update({name:nm,phone:ph}).eq('id',S.u.id));S.pv=false});
if(c==='si')return run(async function(){var r=q(await SB.auth.signInWithPassword({email:val('em'),password:val('pw')}));S.u=r.user});
if(c==='su')return run(async function(){
 var r=await SB.auth.signUp({email:val('em'),password:val('pw'),options:{data:{role:S.role,name:val('nm'),phone:val('ph')}}});if(r.error)throw r.error;
 if(!r.data.session){S.mode='in';throw new Error('اتبعتلك إيميل تأكيد. أكّده وارجع ادخل.')}S.u=r.data.session.user});
if(c==='out'){SB.auth.signOut();S.u=null;S.p=null;S.d={};S.j='';S.view=null;return render()}
run(async function(){
 var R=async function(n,p){q(await SB.rpc(n,p))};
 if(c==='req'){var ids=Object.keys(S.sel).filter(function(k){return S.sel[k]}).map(Number);if(!S.loc)throw new Error('حدّد موقعك الأول');await R('create_order',{p_services:ids,p_pay:S.pm,p_for:S.fam,p_abroad:S.abr,p_lat:S.loc.lat,p_lng:S.loc.lng,p_addr:val('ad')});S.sel={}}
 else if(c==='cancel')await R('cancel_order',{p_id:+x})
 else if(c==='sos'){await R('raise_incident',{p_order:+x});say('تم إبلاغ الشركة ✓. لو الحياة في خطر اتصل ١٢٣')}
 else if(c==='rate')await R('rate_order',{p_id:+x,p_stars:+y})
 else if(c==='cmp'){var t=val('cmt');if(!t)return;var o=S.d.o.filter(function(z){return z.id==x})[0];q(await SB.from('complaints').insert({from_role:'client',client_id:uid,nurse_id:o.nurse_id,order_id:o.id,body:t}));say('اتبعتت شكواك للإدارة ✓')}
 else if(c==='acc')await R('accept_order',{p_id:+x})
 else if(c==='adv')await R('advance_order',{p_id:+x})
 else if(c==='rep'){await R('save_report',{p_id:+x,p_bp:val('rb'),p_sugar:val('rs'),p_notes:val('rn')});var cm=val('cmn');if(cm){var o2=S.d.o.filter(function(z){return z.id==x})[0];q(await SB.from('complaints').insert({from_role:'nurse',client_id:o2.client_id,nurse_id:uid,order_id:o2.id,body:cm}))}}
 else if(c==='subn')await R('submit_nurse',{p_docs:S.d.up})
 else if(c==='ps')q(await SB.from('profiles').update({status:y}).eq('id',x))
 else if(c==='ap')q(await SB.from('nurses').update({reg_status:'ok'}).eq('id',x))
 else if(c==='pd')q(await SB.from('nurses').update({debt:0}).eq('id',x))
 else if(c==='dc'){var fl=q(await SB.storage.from('nurse-docs').list(x));var us=[];for(var i=0;i<fl.length;i++){var s=await SB.storage.from('nurse-docs').createSignedUrl(x+'/'+fl[i].name,600);if(s.data)us.push({n:(DOCS.filter(function(z){return z[0]===fl[i].name.split('.')[0]})[0]||[0,fl[i].name])[1],u:s.data.signedUrl})}S.urls[x]=us}
 else if(c==='cr'){var cc=S.d.cm.filter(function(z){return z.id==x})[0];q(await SB.from('complaints').update({status:'closed',action:y}).eq('id',x));if(y==='إيقاف')q(await SB.from('profiles').update({status:'suspended'}).eq('id',cc.from_role==='client'?cc.nurse_id:cc.client_id))}
 else if(c==='is'){var inc=S.d.in.filter(function(z){return z.id==x})[0],st=inc.steps&&inc.steps.length?inc.steps.slice():[0,0,0,0];st[y]=st[y]?0:1;q(await SB.from('incidents').update({steps:st}).eq('id',x))}
 else if(c==='ir')q(await SB.from('incidents').update({status:'closed',resolved_at:new Date().toISOString()}).eq('id',x))
 else if(c==='set'){q(await SB.from('settings').update({commission:(+val('s1'))/100,visit_fee:+val('s2'),iv_rate15:+val('s3'),debt_limit:+val('s4')}).eq('id',1));say('اتحفظت ✓')}
})});
document.addEventListener('change',function(e){var k=e.target.dataset&&e.target.dataset.doc,fl=e.target.files&&e.target.files[0];if(!k||!fl)return;
 run(async function(){var ext=(fl.name.split('.').pop()||'jpg').toLowerCase();q(await SB.storage.from('nurse-docs').upload(S.u.id+'/'+k+'.'+ext,fl,{upsert:true}))})});
setInterval(function(){var a=document.activeElement;if(S.u&&!(a&&/INPUT|TEXTAREA/.test(a.tagName)))load().catch(function(){});sendLoc()},4000);
(async function(){try{var r=await SB.auth.getSession();S.u=r.data.session?r.data.session.user:null;if(S.u)await load(true);else render()}catch(e){render();say('مشكلة في الاتصال')}})();
try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')}catch(e){}
</script>
